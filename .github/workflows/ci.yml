name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
      - run: ruff check .
      - run: ruff format --check .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { service: gateway, python: "3.14" }
          - { service: homework, python: "3.14" }
          - { service: backoffice, python: "3.14" }
          - { service: journal, python: "3.14" }
          - { service: schedule, python: "3.14" }
          - { service: billing, python: "3.14" }
          - { service: documents, python: "3.13" }
          - { service: notifications, python: "3.14" }
          - { service: pen, python: "3.14" }
          - { service: analytics, python: "3.14" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pipx install poetry
      - name: Install deps
        run: poetry -C services/${{ matrix.service }} install --with dev
      - name: Run tests
        run: poetry -C services/${{ matrix.service }} run pytest -q

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest
      - run: python -m pytest tools/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run test -- --run
      - run: npm run build
      - run: npm audit --audit-level=high

  dependency-audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # documents требует 3.13, остальные — 3.14: нужны оба.
          python-version: |
            3.13
            3.14
      - run: pipx install poetry pip-audit
      - name: pip-audit each service
        run: |
          for svc in gateway homework backoffice journal schedule billing documents notifications pen analytics; do
            echo "::group::pip-audit $svc"
            if poetry -C "services/$svc" install >/dev/null; then
              poetry -C "services/$svc" run pip freeze \
                | pip-audit --requirement /dev/stdin --skip-editable || echo "$svc: найдены уязвимости (см. выше)"
            else
              echo "$svc: poetry install не удался — аудит пропущен"
            fi
            echo "::endgroup::"
          done
