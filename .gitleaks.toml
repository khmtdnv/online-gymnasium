# Известные тестовые значения, не являющиеся секретами: фикстуры тестов
# Gateway и пароль публичной демо-школы (есть в open-source части скриптов).
[allowlist]
description = "Test fixture values and public demo password"
regexTarget = "line"
regexes = [
    '''test-signing-secret-for-hs256-32-bytes''',
    '''test-only-secret-which-is-at-least-32-bytes''',
    '''DemoSchool2026!''',
]
