# Приложения получают готовые контейнерные адреса из .env/.worker.env.
# command только запускает процесс; настройки инфраструктуры — в отдельных env.
# Учётные данные DATABASE_URL должны совпадать с соответствующим .postgres.env.
name: online-gymnasium

services:
  schedule-kafka:
    image: apache/kafka:4.3.1
    hostname: schedule-kafka
    ports:
      - "127.0.0.1:9092:9092"
    env_file:
      - ./services/schedule/.kafka.env
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  schedule-redis:
    image: redis:8.10.1-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
  schedule-postgres:
    image: postgres:18
    env_file:
      - ./services/schedule/.postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - schedule_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  schedule-migrations:
    build:
      context: ./services/schedule
    env_file:
      - ./services/schedule/.env
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      schedule-postgres:
        condition: service_healthy

  schedule-outbox-relay:
    build:
      context: ./services/schedule
    env_file:
      - ./services/schedule/.env
      - ./services/schedule/.worker.env
    command: ["poetry", "run", "python", "-m", "schedule_service.workers.outbox_relay"]
    depends_on:
      schedule-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy

  schedule-cache-invalidator:
    build:
      context: ./services/schedule
    env_file:
      - ./services/schedule/.env
      - ./services/schedule/.worker.env
    command: ["poetry", "run", "python", "-m", "schedule_service.workers.cache_invalidator"]
    depends_on:
      schedule-kafka:
        condition: service_healthy
      schedule-redis:
        condition: service_healthy
    restart: unless-stopped

  schedule-api:
    build:
      context: ./services/schedule
    env_file:
      - ./services/schedule/.env
    command: ["poetry", "run", "uvicorn", "schedule_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      schedule-migrations:
        condition: service_completed_successfully
      schedule-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  analytics-clickhouse:
    env_file:
      - ./services/analytics/.clickhouse.env
    image: clickhouse/clickhouse-server:26.8
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - analytics_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  analytics-worker:
    build:
      context: ./services/analytics
    env_file:
      - ./services/analytics/.clickhouse.env
      - ./services/analytics/.env
      - ./services/analytics/.worker.env
    command:
      - poetry
      - run
      - python
      - -m
      - analytics_service.workers.worker
    depends_on:
      analytics-audit-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy
      analytics-clickhouse:
        condition: service_healthy
    restart: unless-stopped

  analytics-audit-migrations:
    build:
      context: ./services/analytics
    env_file:
      - ./services/analytics/.clickhouse.env
      - ./services/analytics/.env
    command: ["poetry", "run", "python", "-m", "analytics_service.workers.migrate_audit"]
    depends_on:
      analytics-clickhouse:
        condition: service_healthy

  analytics-audit-worker:
    build:
      context: ./services/analytics
    env_file:
      - ./services/analytics/.clickhouse.env
      - ./services/analytics/.env
      - ./services/analytics/.worker.env
    command: ["poetry", "run", "python", "-m", "analytics_service.workers.audit"]
    depends_on:
      analytics-audit-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy
    restart: unless-stopped

  analytics-api:
    build:
      context: ./services/analytics
    env_file:
      - ./services/analytics/.clickhouse.env
      - ./services/analytics/.env
    command:
      - poetry
      - run
      - uvicorn
      - analytics_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8001:8000"
    depends_on:
      analytics-audit-migrations:
        condition: service_completed_successfully
      analytics-clickhouse:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  document-postgres:
    image: postgres:18
    env_file:
      - ./services/documents/.postgres.env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - document_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  document-rabbitmq:
    image: rabbitmq:4.1.8-management
    env_file:
      - ./services/documents/.rabbitmq.env
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  document-minio:
    image: ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    env_file:
      - ./services/documents/.minio.env
    volumes:
      - document_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  document-minio-init:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/mc@sha256:b6bfd6dc86587bacd1d630a4de936adeba05f2f6e1e3c7aa6dbc1e16302a69cf
    env_file:
      - ./services/documents/.env
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - >
        mc alias set documents http://document-minio:9000 "$${MINIO_ACCESS_KEY}" "$${MINIO_SECRET_KEY}"
        && mc mb --ignore-existing documents/"$${MINIO_BUCKET}"
    depends_on:
      document-minio:
        condition: service_healthy

  document-migrations:
    build:
      context: ./services/documents
    env_file:
      - ./services/documents/.env
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      document-postgres:
        condition: service_healthy

  document-api:
    build:
      context: ./services/documents
    env_file:
      - ./services/documents/.env
    command:
      - poetry
      - run
      - uvicorn
      - document_service.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      document-migrations:
        condition: service_completed_successfully
      document-minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/live')",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  document-dispatcher:
    build:
      context: ./services/documents
    env_file:
      - ./services/documents/.env
    command: poetry run python -m document_service.infrastructure.document_task_outbox_worker
    depends_on:
      document-migrations:
        condition: service_completed_successfully
      document-rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  document-worker:
    build:
      context: ./services/documents
    env_file:
      - ./services/documents/.env
    command:
      - poetry
      - run
      - celery
      - -A
      - document_service.infrastructure.worker:celery_app
      - worker
      - --loglevel=INFO
    depends_on:
      document-migrations:
        condition: service_completed_successfully
      document-rabbitmq:
        condition: service_healthy
      document-minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  gateway-postgres:
    image: postgres:18
    env_file:
      - ./services/gateway/.postgres.env
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - gateway_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  gateway-migrations:
    build:
      context: ./services/gateway
    env_file:
      - ./services/gateway/.env
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      gateway-postgres:
        condition: service_healthy

  gateway-api:
    build:
      context: ./services/gateway
    env_file:
      - ./services/gateway/.env
    command: ["poetry", "run", "uvicorn", "gateway_service.main:app", "--host", "0.0.0.0", "--port", "8000", "--ws-max-size", "65536", "--ws-max-queue", "4"]
    ports:
      - "127.0.0.1:8003:8000"
    depends_on:
      gateway-migrations:
        condition: service_completed_successfully

  backoffice-postgres:
    image: postgres:18
    env_file:
      - ./services/backoffice/.postgres.env
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - backoffice_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backoffice-migrations:
    build:
      context: ./services/backoffice
    env_file:
      - ./services/backoffice/.env
    command: ["/app/.venv/bin/python", "manage.py", "migrate", "--noinput"]
    depends_on:
      backoffice-postgres:
        condition: service_healthy

  backoffice-api:
    build:
      context: ./services/backoffice
    volumes:
      - ./services/backoffice/src:/app/src:ro
      - ./services/backoffice/manage.py:/app/manage.py:ro
    env_file:
      - ./services/backoffice/.env
    command: poetry run gunicorn backoffice.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile -
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      backoffice-migrations:
        condition: service_completed_successfully

  backoffice-static:
    build:
      context: ./services/backoffice
    env_file:
      - ./services/backoffice/.env
    command: poetry run python manage.py collectstatic --noinput
    volumes:
      - backoffice_static:/app/staticfiles

  journal-postgres:
    image: postgres:18
    env_file:
      - ./services/journal/.postgres.env
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - journal_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  journal-migrations:
    build:
      context: ./services/journal
    env_file:
      - ./services/journal/.env
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      journal-postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./services/frontend

  journal-api:
    build:
      context: ./services/journal
    env_file:
      - ./services/journal/.env
    command: ["poetry", "run", "uvicorn", "journal_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      journal-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  homework-postgres:
    image: postgres:18
    env_file:
      - ./services/homework/.postgres.env
    ports:
      - "127.0.0.1:5437:5432"
    volumes:
      - homework_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  homework-minio:
    image: ghcr.io/l33tlamer/minio-backup@sha256:a1ea29fa28355559ef137d71fc570e508a214ec84ff8083e39bc5428980b015e
    command: server /data --console-address ":9001"
    env_file:
      - ./services/homework/.minio.env
    volumes:
      - homework_minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  homework-minio-init:
    image: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/docker.io/minio/mc@sha256:b6bfd6dc86587bacd1d630a4de936adeba05f2f6e1e3c7aa6dbc1e16302a69cf
    env_file:
      - ./services/homework/.minio.env
    entrypoint: ["/bin/sh", "/init/init.sh"]
    volumes:
      - ./services/homework/minio:/init:ro
    depends_on:
      homework-minio:
        condition: service_healthy

  homework-migrations:
    build:
      context: ./services/homework
    env_file:
      - ./services/homework/.env
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      homework-postgres:
        condition: service_healthy

  homework-cleanup:
    profiles: ["tools"]
    build:
      context: ./services/homework
    env_file:
      - ./services/homework/.env
    command: ["/app/.venv/bin/python", "-m", "homework_service.cleanup_files"]
    depends_on:
      homework-migrations:
        condition: service_completed_successfully
      homework-minio-init:
        condition: service_completed_successfully

  homework-api:
    build:
      context: ./services/homework
    env_file:
      - ./services/homework/.env
    command: ["poetry", "run", "uvicorn", "homework_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8006:8000"
    depends_on:
      homework-migrations:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health/ready', timeout=4).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  homework-outbox-relay:
    build:
      context: ./services/homework
    env_file:
      - ./services/homework/.env
      - ./services/homework/.worker.env
    command: ["poetry", "run", "python", "-m", "homework_service.workers.outbox_relay"]
    depends_on:
      homework-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy
    restart: unless-stopped

  journal-outbox-relay:
    build:
      context: ./services/journal
    env_file:
      - ./services/journal/.env
      - ./services/journal/.worker.env
    command: ["poetry", "run", "python", "-m", "journal_service.workers.outbox_relay"]
    depends_on:
      journal-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy
    restart: unless-stopped

  gateway-outbox-relay:
    build:
      context: ./services/gateway
    env_file:
      - ./services/gateway/.env
      - ./services/gateway/.worker.env
    command: ["poetry", "run", "python", "-m", "gateway_service.workers.outbox_relay"]
    depends_on:
      gateway-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy
    restart: unless-stopped

  backoffice-outbox-relay:
    build:
      context: ./services/backoffice
    env_file:
      - ./services/backoffice/.env
      - ./services/backoffice/.worker.env
    command: ["poetry", "run", "python", "manage.py", "relay_events"]
    depends_on:
      backoffice-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy
    restart: unless-stopped

  pen-postgres:
    image: postgres:18
    env_file:
      - ./services/pen/.postgres.env
    volumes:
      - pen_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  pen-migrations:
    build:
      context: ./services/pen
    env_file:
      - ./services/pen/.env
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      pen-postgres:
        condition: service_healthy

  pen-api:
    build:
      context: ./services/pen
    env_file:
      - ./services/pen/.env
    command: ["poetry", "run", "uvicorn", "pen_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      pen-migrations:
        condition: service_completed_successfully

  notifications-postgres:
    image: postgres:18
    env_file:
      - ./services/notifications/.postgres.env
    volumes:
      - notifications_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  notifications-migrations:
    build:
      context: ./services/notifications
    env_file:
      - ./services/notifications/.env
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      notifications-postgres:
        condition: service_healthy

  notifications-api:
    build:
      context: ./services/notifications
    env_file:
      - ./services/notifications/.env
    command: ["poetry", "run", "uvicorn", "notifications_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      notifications-migrations:
        condition: service_completed_successfully

  notifications-worker:
    build:
      context: ./services/notifications
    env_file:
      - ./services/notifications/.env
      - ./services/notifications/.worker.env
    command: ["poetry", "run", "python", "-m", "notifications_service.workers"]
    depends_on:
      notifications-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy
    restart: unless-stopped

  document-outbox-relay:
    build:
      context: ./services/documents
    env_file:
      - ./services/documents/.env
      - ./services/documents/.worker.env
    command: ["poetry", "run", "python", "-m", "document_service.infrastructure.event_relay"]
    depends_on:
      document-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy
    restart: unless-stopped

  billing-postgres:
    image: postgres:18
    env_file:
      - ./services/billing/.postgres.env
    volumes:
      - billing_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  billing-migrations:
    build:
      context: ./services/billing
    env_file:
      - ./services/billing/.env
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      billing-postgres:
        condition: service_healthy

  billing-api:
    build:
      context: ./services/billing
    env_file:
      - ./services/billing/.env
    command: ["poetry", "run", "uvicorn", "billing_service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      billing-migrations:
        condition: service_completed_successfully

  billing-reconcile:
    build:
      context: ./services/billing
    env_file:
      - ./services/billing/.env
    command: ["poetry", "run", "python", "-m", "billing_service.workers", "reconcile"]
    depends_on:
      billing-migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  billing-outbox-relay:
    build:
      context: ./services/billing
    env_file:
      - ./services/billing/.env
      - ./services/billing/.worker.env
    command: ["poetry", "run", "python", "-m", "billing_service.workers", "relay"]
    depends_on:
      billing-migrations:
        condition: service_completed_successfully
      schedule-kafka:
        condition: service_healthy
    restart: unless-stopped

  billing-invoices:
    build:
      context: ./services/billing
    env_file:
      - ./services/billing/.env
      - ./services/billing/.worker.env
    command: ["poetry", "run", "python", "-m", "billing_service.workers", "invoices"]
    depends_on:
      billing-migrations:
        condition: service_completed_successfully
      journal-api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./deploy/web
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - backoffice_static:/srv/backoffice-static:ro
    depends_on:
      frontend:
        condition: service_started
      gateway-api:
        condition: service_started
      backoffice-api:
        condition: service_started
      backoffice-static:
        condition: service_completed_successfully

