limit_req_zone $binary_remote_addr zone=billing_webhook:1m rate=10r/s;
limit_req_zone $binary_remote_addr zone=portal_login:1m rate=2r/s;
limit_req_zone $binary_remote_addr zone=admin_login:1m rate=2r/s;
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway-api:8000;
    set $backoffice http://backoffice-api:8000;
    set $frontend http://frontend:80;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Значения forwarded заменяются в include, а не берутся из запроса клиента.
    include /etc/nginx/og-proxy-headers.conf;

    location ^~ /internal/ { return 404; }
    location = /internal { return 404; }
    # Файловый маршрут идёт перед общими regex; обычный JSON остаётся с1МиБ.
    location ~ ^/api/v1/homework/[0-9]+/(answers/[0-9]+/)?files/[0-9]+$ {
        client_max_body_size 11m;
        client_body_timeout 300s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 300s;
        proxy_next_upstream off;
        proxy_pass $gateway;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /api/v1/pen/ {
        include /etc/nginx/og-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $gateway;
        add_header Cache-Control no-store always;
    }
    location = /api/v1/billing/yookassa/webhook {
        limit_req zone=billing_webhook burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 64k;
        proxy_pass $gateway;
        add_header Cache-Control no-store always;
    }
    location = /api/v1/auth/login {
        limit_req zone=portal_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $gateway;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location /api/v1/ {
        proxy_pass $gateway;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /api/ { return 404; }
    location = /admin { return 302 /admin/; }
    location = /admin/login/ {
        limit_req zone=admin_login burst=10 nodelay;
        limit_req_status 429;
        proxy_read_timeout 120s;
        proxy_pass $backoffice;
    }
    location ^~ /admin/ {
        proxy_read_timeout 120s;
        proxy_pass $backoffice;
    }
    location ^~ /static/ {
        alias /srv/backoffice-static/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { return 404; }
    location / { proxy_pass $frontend; }
}
