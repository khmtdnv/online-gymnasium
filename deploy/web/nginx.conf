server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway-api:8000;
    set $backoffice http://backoffice-api:8000;
    set $frontend http://frontend:80;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Значения forwarded заменяются в include, а не берутся из запроса клиента.
    include /etc/nginx/og1-proxy-headers.conf;

    location ^~ /internal/ { return 404; }
    location = /internal { return 404; }
    location ^~ /api/v1/ {
        proxy_pass $gateway;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /api/ { return 404; }
    location = /admin { return 302 /admin/; }
    location ^~ /admin/ { proxy_pass $backoffice; }
    location ^~ /static/ {
        alias /srv/backoffice-static/;
        add_header Cache-Control "public, max-age=3600";
        add_header X-Content-Type-Options nosniff always;
    }
    location ~ /\. { return 404; }
    location / { proxy_pass $frontend; }
}
