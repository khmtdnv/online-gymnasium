map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;
    client_max_body_size 1m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway-api:8000;
    set $backoffice http://backoffice-api:8000;
    set $frontend http://frontend-dev:5173;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    include /etc/nginx/og1-proxy-headers.conf;

    location ^~ /internal/ { return 404; }
    location = /internal { return 404; }
    location ^~ /api/v1/ {
        proxy_pass $gateway;
        add_header Cache-Control no-store always;
        add_header X-Content-Type-Options nosniff always;
    }
    location ^~ /api/ { return 404; }
    location = /admin { return 302 /admin/; }
    location ^~ /admin/ { proxy_pass $backoffice; }
    location ^~ /static/ {
        alias /srv/backoffice-static/;
        add_header X-Content-Type-Options nosniff always;
    }
    # Dev-модули используют .pnpm и .vite. Другие скрытые сегменты запрещены.
    # Это regex-правило должно стоять перед общим запретом ниже.
    location ~ ^/node_modules/\.(pnpm|vite)/(?!\.)(?!.*/\.) {
        proxy_pass $frontend;
    }
    location ~ /\. { return 404; }
    location / {
        # Здесь есть location-level headers: повторяем общий include для наследования.
        include /etc/nginx/og1-proxy-headers.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_pass $frontend;
    }
}
