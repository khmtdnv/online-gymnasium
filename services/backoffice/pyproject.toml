[project]
name = "backoffice-service"
version = "0.1.0"
description = "OG1 backoffice service"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django (>=6.1.1,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "psycopg[binary] (>=3.3.6,<4.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
]

[tool.poetry]
packages = [
    { include = "backoffice", from = "src" },
    { include = "backoffice_admin", from = "src" }
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-django (>=4.14.0,<5.0.0)",
    "pytest-env (>=1.7.1,<2.0.0)",
    "ruff (>=0.16.9,<0.17.0)",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.per-file-ignores]
"src/backoffice_admin/migrations/*.py" = ["RUF012"]