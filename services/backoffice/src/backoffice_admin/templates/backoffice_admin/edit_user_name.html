{% extends "admin/base_site.html" %}
{% block content_title %}{% endblock %}
{% block content %}
<section class="og1-form-card">
  <h1>{{ title }}</h1>
  {% if profile %}<p>{{ profile.email }}</p>{% endif %}
  {% if service_error %}<p role="alert">{{ service_error }}</p>{% endif %}
  <form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit"{% if not can_submit %} disabled{% endif %}>Сохранить ФИО</button></form>
  <a href="{% url 'backoffice-list-users' %}">К поиску пользователей</a>
</section>
{% endblock %}
