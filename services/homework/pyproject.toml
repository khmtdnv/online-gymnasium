[project]
name = "homework-service"
version = "0.1.0"
description = "OG homework service"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "fastapi (>=0.143.0,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
    "asyncpg (>=0.32.0,<0.33.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "minio (>=7.2.20,<8.0.0)",
    "pypdf (>=6.21.1,<7.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "defusedxml (>=0.7.1,<0.8.0)",
    "python-multipart (>=0.0.32,<0.1.0)",
    "anyio (>=4.15.1,<5.0.0)",
    "urllib3 (>=2.8.0,<3.0.0)",
    "aiokafka (>=0.14.0,<0.15.0)",
]

[dependency-groups]
dev = ["pytest (>=9.1.1,<10.0.0)", "ruff (>=0.16.10,<0.17.0)"]

[tool.poetry]
packages = [{ include = "homework_service", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.pytest.ini_options]
markers = [
    "learning: учебные acceptance-тесты CreateHomeworkHandler",
    "integration: отдельная PostgreSQL с именем homework_test_*",
]
