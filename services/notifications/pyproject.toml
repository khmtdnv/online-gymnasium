[project]
name = "notifications-service"
version = "0.1.0"
description = "OG in-app notifications"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.143,<0.144", "uvicorn[standard]>=0.54,<0.55",
  "pydantic>=2.14,<3", "pydantic-settings>=2.15,<3",
  "sqlalchemy[asyncio]>=2.1,<3", "asyncpg>=0.32,<0.33", "alembic>=1.20,<2",
  "aiokafka>=0.14,<0.15",
]
[tool.poetry]
packages = [{include="notifications_service", from="src"}]
[build-system]
requires = ["poetry-core>=2,<3"]
build-backend = "poetry.core.masonry.api"
[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.16,<0.17", "httpx>=0.28,<0.29"]
[tool.ruff]
target-version = "py314"
line-length = 88
[tool.ruff.lint]
extend-select = ["I"]
