[project]
name = "pen-service"
version = "0.1.0"
description = "Saved handwriting batches for the OG simulator"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi (>=0.143.0,<0.144.0)",
  "uvicorn[standard] (>=0.54.0,<0.55.0)",
  "pydantic (>=2.13.5,<3.0.0)",
  "pydantic-settings (>=2.15.0,<3.0.0)",
  "sqlalchemy[asyncio] (>=2.1.4,<3.0.0)",
  "asyncpg (>=0.32.0,<0.33.0)",
  "alembic (>=1.20.0,<2.0.0)",
]

[dependency-groups]
dev = ["pytest (>=9.1.1,<10.0.0)", "ruff (>=0.16.10,<0.17.0)", "httpx (>=0.28.1,<0.29.0)"]

[tool.poetry]
packages = [{ include = "pen_service", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]
